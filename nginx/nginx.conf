worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # don't advertise the nginx version in headers and error pages
  server_tokens off;

  # One JSON object per request. request_id is also forwarded to the
  # gateway (X-Request-Id), so an nginx line and the gateway's log line for
  # the same request can be joined on it. upstream_response_time vs
  # request_time shows how much of the latency was the gateway itself.
  log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time"'
  '}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # Edge rate limit, per client IP, BEFORE a request reaches Node. This is
  # the layer that stops API-key brute forcing: the gateway's own limiter
  # is per merchant and only runs after a key is valid, so invalid-key
  # floods would otherwise all reach Postgres (see DECISIONS.md 016/019).
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;
  limit_req_status 429;

  # docker's embedded DNS; re-resolve every 5s so `docker compose up
  # --scale gateway=3` (or a restarted container with a new IP) is picked up
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream gateway {
    zone gateway 64k;
    server gateway:3000 resolve;
    # reuse TCP connections to the gateway instead of a new handshake per
    # request -- the same reasoning as the Postgres pool, one hop earlier
    keepalive 32;
  }

  server {
    listen 80;

    # payment requests are a few hundred bytes; refuse anything absurd
    # before it's buffered into memory
    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /process can legitimately take 10s+ (bank timeout); nginx's default
    # 60s read timeout is fine, but connect should fail fast
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # Operator endpoint: only from private networks (your machine via the
    # docker bridge counts), never from the public internet -- on top of
    # the ADMIN_TOKEN the gateway already requires.
    location ~ ^/(metrics|admin/) {
      allow 127.0.0.0/8;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://gateway;
    }

    location / {
      limit_req zone=per_ip burst=100 nodelay;
      proxy_pass http://gateway;
    }
  }
}
